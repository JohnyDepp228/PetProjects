name: Deploy Doxygen
on:
  push:
    branches:
      - Bank # или ваша основная ветка
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate and Deploy Doxygen Docs
        uses: AgarwalSaurav/ghaction-doxygen-ghpages@release/v2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          doxyfile-path: Bank/doc/Doxyfile # путь к вашему Doxyfile
          branch: gh-pages # ветка для публикации документации
